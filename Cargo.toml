[package]
name = "whois-rust"
version = "3.0.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/whois-rust"
homepage = "https://magiclen.org/whois-rust"
keywords = ["whois"]
categories = ["network-programming"]
description = "This is a WHOIS client library for Rust, inspired by https://github.com/hjr265/node-whois"
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
serde_json = "1.0.45"
regex = "1"

hickory-client = { version = "0.24", optional = true }

tokio = { version = "1.21", features = ["fs", "net", "time", "io-util"], optional = true }

validators = { version = "0.26", default-features = false, features = ["derive", "host"] }

chardetng = { version = "1", optional = true }

# Not `use`d directly. `chardetng` depends on `encoding_rs` with
# `default-features = false`, but `Encoding::decode` is gated behind `alloc`.
encoding_rs = { version = "0.8.29", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1.21", features = ["macros", "rt"] }

[features]
default = ["charset"]

charset = ["dep:chardetng", "dep:encoding_rs"]

tokio = ["dep:tokio"]

srv = ["dep:hickory-client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]